name: CI

# Automated gate for the game code. Runs on every PR targeting main and on
# pushes to main.
#
#   verify — `npm run verify` (prettier --check src/ eslint-rules/, eslint,
#            tsc --noEmit, the type-aware lint:types layer, the sim-boundary,
#            asset-path, e2e-geometry, and ant-cycle grep/parse guards, and the
#            full Vitest unit/integration suite), then compiles both production
#            targets (`npm run build` + `build:lib`) as a smoke gate. The
#            `verify` command itself is what contributors run locally before
#            pushing.
#   e2e    — `npm run test:e2e` (Playwright, chromium headless). The webServer
#            pins VITE_PLAYTRACE_ENDPOINT empty so the run is deterministic
#            regardless of a developer's .env.local (see playwright.config.ts).
#
# Coverage (`npm run test:coverage`) is intentionally a LOCAL-ONLY pre-push tool,
# by design — not a CI gate. The 80% thresholds pass, but v8 instrumentation on a
# 2-core runner multiplies the long simulation integration tests
# (ai-controller.integration, foraging-survival, determinism) several-fold past
# their inline per-test timeouts, so the job fails on runtime, not on coverage. The
# fix would mean scaling inline timeouts across ~11 test sites to absorb a flaky
# instrumentation multiplier — permanent complexity for a redundant signal, since
# `verify` already runs the identical suite UN-instrumented and gates correctness.
# So coverage stays local (run it before pushing); CI gates correctness, not %.
# Decision recorded in issue #188 (closed).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege — CI only reads the repo to install, lint, and test.
permissions:
  contents: read

# Cancel superseded runs on the same ref (rapid pushes / PR synchronize events).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (format, lint, types, sim/asset guards, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Production build smoke gate (#239): a lib-mode-only breakage (rollup
      # config, manifest/dts plugin, .d.ts emit) otherwise first surfaces in the
      # website deploy POST-merge, after the submodule pointer is already pushed.
      # Compile both targets here. Artifacts are NOT uploaded — this is a gate,
      # not a release step. (build = tsc && vite build; the tsc re-run duplicates
      # verify's tsc --noEmit by a few seconds — acceptable for the isolation.)
      - run: npm run build
      - run: npm run build:lib

  e2e:
    name: e2e (Playwright chromium + webkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # webkit (#254) runs ONLY the cross-engine-determinism spec (JSC axis); the
      # rendering/touch specs stay chromium-only. See playwright.config.ts projects.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
